name: Daily Push Notification

on:
  schedule:
    # Every day at 18:00 UTC (20:00 in Italy during CEST). Adjust as needed.
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  trigger-supabase-edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FUNCTION_URL: ${{ secrets.FUNCTION_URL }}
        run: |
          if [ -z "$FUNCTION_URL" ]; then
            echo "Missing FUNCTION_URL secret (e.g., https://<project-ref>.supabase.co/functions/v1/send-daily-push)" >&2
            exit 1
          fi
          curl -sS -X POST "$FUNCTION_URL" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-actions"}'
