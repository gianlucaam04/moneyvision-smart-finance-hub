name: Daily Push Notification

on:
  schedule:
    # Every day at 18:30 UTC (20:30 in Italy during CEST) for testing.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-supabase-edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FUNCTION_URL: ${{ secrets.FUNCTION_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$FUNCTION_URL" ]; then
            echo "Missing FUNCTION_URL secret (e.g., https://<project-ref>.supabase.co/functions/v1/send-daily-push)" >&2
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_ANON_KEY secret (Project Settings -> API -> anon key)" >&2
            exit 1
          fi
          curl -sS --retry 3 --retry-all-errors -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-actions"}'
