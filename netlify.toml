[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every page is a real file (index.html, about.html, ...) and unknown URLs get
# 404.html with a 404 status. There is deliberately no catch-all rewrite to
# index.html: that would answer 200 to any address and hide broken links.

# One address per page. The Netlify subdomain used to answer 200 with the whole
# site, so search engines could see two copies of it and pick the wrong one.
# Permanent redirect to the real domain. (www.moneyvision.it and plain http
# already redirect to https://moneyvision.it/ through the domain settings.)
[[redirects]]
  from = "https://moneyvisionv2.netlify.app/*"
  to = "https://moneyvision.it/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Scripts only from this origin. Inline styles are allowed because the
    # pre-rendered markup carries a few style attributes (CSS custom properties).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Files with a content hash in their name never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
